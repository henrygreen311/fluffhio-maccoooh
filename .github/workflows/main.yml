name: proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.115.100.34
          version: 1.94.2
          timeout: 2m
          retry: 5
          use-cache: true

      - name: Enable IP forwarding
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

      - name: Advertise Exit Node
        run: |
          sudo tailscale set --advertise-exit-node

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Runner Tailscale IP: $TS_IP"

      - name: Check Runner Public IP
        run: |
          echo "GitHub runner public IP:"
          curl -4 https://ifconfig.me
          echo

      - name: Install Dante
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server netcat-openbsd

      - name: Configure Dante
        run: |
          sudo tee /etc/danted.conf > /dev/null <<EOF
          logoutput: stderr
          internal: ${TS_IP} port = 1080
          external: eth0
          clientmethod: none
          socksmethod: none
          user.privileged: root
          user.notprivileged: nobody

          client pass {
              from: 100.64.0.0/10 to: 0.0.0.0/0
          }

          socks pass {
              from: 100.64.0.0/10 to: 0.0.0.0/0
              command: connect
              protocol: tcp
          }
          EOF

      - name: Validate Dante
        run: |
          sudo danted -f /etc/danted.conf -V

      - name: Start Dante
        run: |
          sudo systemctl restart danted
          sleep 3
          sudo systemctl --no-pager --full status danted

      - name: Test SOCKS5
        run: |
          sudo ss -lntp | grep ':1080'
          nc -zv "$TS_IP" 1080
          echo "SOCKS5 proxy is listening on $TS_IP:1080"

      - name: Test Tailscale Connection
        run: |
          tailscale ping 100.115.100.34

      - name: Verify Exit Node
        run: |
          tailscale debug prefs | grep -i exit

      - name: Keep Proxy Alive
        run: |
          while true; do
            echo "Exit node active on $TS_IP"
            echo "SOCKS5 proxy running at $TS_IP:1080"
            sleep 60
          done
