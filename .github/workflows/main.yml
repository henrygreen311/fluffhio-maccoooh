name: Tailscale SOCKS5 Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.115.100.34
          version: 1.94.2
          timeout: 2m
          retry: 5
          use-cache: true

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Runner Tailscale IP: $TS_IP"

      - name: Install Dante
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server

      - name: Configure Dante
        run: |
          sudo tee /etc/danted.conf > /dev/null <<EOF
          logoutput: stderr
          internal: ${TS_IP} port = 1080
          external: eth0
          clientmethod: none
          socksmethod: none
          user.privileged: root
          user.notprivileged: nobody

          client pass {
              from: 100.64.0.0/10 to: ${TS_IP}/32
          }

          socks pass {
              from: 100.64.0.0/10 to: 0.0.0.0/0
              command: connect
              protocol: tcp
          }
          EOF

      - name: Start Dante
        run: |
          sudo systemctl restart danted
          sleep 3
          sudo systemctl --no-pager status danted

      - name: Verify Proxy
        run: |
          echo "Tailscale IP: ${TS_IP}"
          echo "SOCKS5 proxy: ${TS_IP}:1080"
          sudo ss -lntp | grep ':1080'

      - name: Keep Runner Alive
        run: |
          while true; do
            sleep 60
          done
